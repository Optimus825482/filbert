name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://filbert_ci:filbert_ci_password@localhost:5432/filbert_ci?schema=public
      # Davranışsal entegrasyon testleri bu veritabanına karşı çalışır.
      TEST_DATABASE_URL: postgresql://filbert_ci:filbert_ci_password@localhost:5432/filbert_ci?schema=public
      SYSTEM_ADMIN_MAIL: ci-admin@example.test
      SYSTEM_ADMIN_PASS: ci-only-long-administrator-password
      SYSTEM_MAIN_PASS: ci-only-long-setup-secret
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: filbert_ci
          POSTGRES_PASSWORD: filbert_ci_password
          POSTGRES_DB: filbert_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filbert_ci -d filbert_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Verify migration history matches Prisma schema
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Verify lint, types, and unit tests
        run: pnpm check

      - name: Build production bundle
        run: pnpm build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://filbert_ci:filbert_ci_password@localhost:5432/filbert_ci?schema=public
      SYSTEM_ADMIN_MAIL: ci-admin@example.test
      SYSTEM_ADMIN_PASS: ci-only-long-administrator-password
      SYSTEM_MAIN_PASS: ci-only-long-setup-secret
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: filbert_ci
          POSTGRES_PASSWORD: filbert_ci_password
          POSTGRES_DB: filbert_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filbert_ci -d filbert_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and apply migrations
        run: |
          pnpm db:generate
          pnpm prisma migrate deploy

      - name: Install Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run critical browser regression tests
        run: pnpm test:e2e
